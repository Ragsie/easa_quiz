name: Build & Publish Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install & Cache Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          dir: ${{ runner.temp }}
          cache: 'true'
          cache-key-prefix: '${{ runner.os }}-Qt-6.6.2-mingw64'

      # 2. Configure & Build Project med CMake og Ninja
      - name: Configure CMake
        run: |
          cmake -S code -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release

      # 3. Saml Qt DLL'er med windeployqt
      - name: Collect Dependencies (windeployqt)
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\Easa-B2-Quiz.exe dist\Easa-B2-Quiz.exe
          windeployqt --release --no-translations --no-system-d3d-compiler dist\Easa-B2-Quiz.exe

      # 4. Pak alt sammen til én enkelt Easa-B2-Quiz.exe (SFX Standalone)
      - name: Package Single-File Standalone EXE
        run: |
          # 1. Pak dist-mappen ned i et 7z-arkiv
          & "C:\Program Files\7-Zip\7z.exe" a -r -mx9 app.7z .\dist\*

          # 2. Lav konfiguration der starter spillet direkte ved dobbeltklik
          $config = @"
          ;!@Install@!UTF-8!
          Title="EASA Part-66 B2 Exam Quiz"
          RunProgram="Easa-B2-Quiz.exe"
          ;!@InstallEnd@!
          "@
          [System.IO.File]::WriteAllText("config.txt", $config, [System.Text.Encoding]::UTF8)

          # 3. Smelt 7z SFX-modulet sammen med konfigurationen og arkivet til Easa-B2-Quiz.exe
          cmd /c "copy /b `"C:\Program Files\7-Zip\7z.sfx`" + config.txt + app.7z Easa-B2-Quiz.exe"

      # 5. Upload Artifact (kan hentes direkte fra GitHub efter build)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easa-B2-Quiz-Windows
          path: Easa-B2-Quiz.exe
          if-no-files-found: error

      # 6. Opret GitHub Release (hvis der er pushet et versionstag som v1.0)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Easa-B2-Quiz.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
