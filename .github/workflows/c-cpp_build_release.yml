name: Build & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Installer den nøjagtige Qt version med MinGW 13.1.0
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          dir: ${{ runner.temp }}
          cache: 'true'
          cache-key-prefix: '${{ runner.os }}-Qt-6.8.0-mingw64'

      # 2. Opsæt PATH til Qt og MinGW værktøjer
      - name: Setup Qt & MinGW Environment
        run: |
          $qtBin = "${{ env.Qt6_DIR }}\bin"
          $toolsPath = "${{ runner.temp }}\Qt\Tools"
          $mingw = (Get-ChildItem -Path $toolsPath -Filter "g++.exe" -Recurse | Select-Object -First 1).DirectoryName
          if ($mingw) {
            echo "$mingw" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          echo "$qtBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 3. Konfigurer og byg projektet med Ninja
      - name: Configure and Build
        run: |
          cmake -S code -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      # 4. Klargør mappen og saml alle Qt 6.8 / MinGW 13 DLL'er
      - name: Collect Dependencies (windeployqt)
        run: |
          New-Item -ItemType Directory -Force -Path Easa-B2-Quiz
          Copy-Item build\Easa-B2-Quiz.exe Easa-B2-Quiz\Easa-B2-Quiz.exe
          
          # Saml alle Qt-afhængigheder
          windeployqt --release --no-translations --compiler-runtime Easa-B2-Quiz\Easa-B2-Quiz.exe
          
          # Hent de matchende MinGW 13 runtime DLL'er
          $qtBin = "${{ env.Qt6_DIR }}\bin"
          Copy-Item "$qtBin\libstdc++-6.dll" Easa-B2-Quiz\ -ErrorAction SilentlyContinue
          Copy-Item "$qtBin\libgcc_s_seh-1.dll" Easa-B2-Quiz\ -ErrorAction SilentlyContinue
          Copy-Item "$qtBin\libwinpthread-1.dll" Easa-B2-Quiz\ -ErrorAction SilentlyContinue

      # 5. Pak hele mappen til en ren ZIP-distribution
      - name: Create Portable Zip
        run: |
          Compress-Archive -Path Easa-B2-Quiz -DestinationPath Easa-B2-Quiz-Windows.zip -Force

      # 6. Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easa-B2-Quiz-Windows
          path: Easa-B2-Quiz-Windows.zip
          if-no-files-found: error

      # 7. Opret GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Easa-B2-Quiz-Windows.zip
          tag_name: build-${{ github.run_number }}
          name: "EASA B2 Quiz - Build ${{ github.run_number }}"
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}