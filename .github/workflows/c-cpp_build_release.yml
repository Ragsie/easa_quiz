name: Build & Publish Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          cache: 'true'
          cache-key-prefix: '${{ runner.os }}-Qt-6.6.2-mingw64'

      # 2. Configure & Build Project med CMake og Ninja
      - name: Configure CMake
        run: |
          cmake -S code -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release

      # 3. Saml Qt DLL'er med windeployqt
      - name: Collect Dependencies (windeployqt)
        run: |
          mkdir dist
          copy build\Easa-B2-Quiz.exe dist\app_base.exe
          windeployqt --release --no-translations --no-system-d3d-compiler dist\app_base.exe

      # 4. Pak alt sammen med Enigma Virtualbox Action til én enkelt fil
      - name: Enigma Virtualbox Action
        uses: qiazo/enigma-virtualbox-action@v1
        with:
          entry: dist
          input: dist/app_base.exe
          output: Easa-B2-Quiz.exe

      # 5. Upload som Artifact (kan downloades under workflow-kørslen)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easa-B2-Quiz-Windows
          path: Easa-B2-Quiz.exe

      # 6. Opret GitHub Release (hvis der pushes et versionstag som v1.0)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Easa-B2-Quiz.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
