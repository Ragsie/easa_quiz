name: Build & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Cache Chocolatey / Tools (Ninja & Enigma Virtual Box)
      - name: Cache Tools (Chocolatey)
        uses: actions/cache@v4
        id: cache-tools
        with:
          path: |
            C:\ProgramData\chocolatey\bin
            C:\ProgramData\chocolatey\lib
            C:\Program Files (x86)\Enigma Virtual Box
          key: ${{ runner.os }}-tools-v1

      - name: Install Tools if not cached
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          choco install ninja enigma-virtual-box --no-progress

      # 2. Cache Qt-installationen
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: ${{ runner.os }}-Qt-6.6.2-mingw64

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          dir: ${{ runner.temp }}
          cached: ${{ steps.cache-qt.outputs.cache-hit }}

      # 3. Configure & Build Project
      - name: Configure CMake
        run: |
          cmake -S code -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release

      # 4. Saml afhængigheder med windeployqt
      - name: Collect Dependencies (windeployqt)
        run: |
          mkdir dist
          copy build\b2_quiz.exe dist\
          windeployqt --release --no-translations --no-system-d3d-compiler dist\b2_quiz.exe

      # 5. Pak til Single-File EXE
      - name: Package Single-File EXE (Enigma Virtual Box)
        run: |
          & "C:\Program Files (x86)\Enigma Virtual Box\enigmavbgen.exe" dist\b2_quiz.exe dist\b2_quiz_standalone.exe dist\
          & "C:\Program Files (x86)\Enigma Virtual Box\enigmavbconsole.exe" generated_project.evb

      # 6. Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EASA_B2_Quiz_Executable
          path: dist/b2_quiz_standalone.exe

      # 7. Opret GitHub Release (hvis der er et git tag)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Easa_B2_Quiz.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
