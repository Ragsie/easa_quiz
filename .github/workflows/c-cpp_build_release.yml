name: Build & Publish Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install & Cache Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          dir: ${{ runner.temp }}
          cache: 'true'
          cache-key-prefix: '${{ runner.os }}-Qt-6.6.2-mingw64'

      # 2. Configure & Build Project med CMake og Ninja
      - name: Configure CMake
        run: |
          cmake -S code -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release

# 3. Saml Qt DLL'er med windeployqt
      - name: Collect Dependencies (windeployqt)
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\Easa-B2-Quiz.exe dist\quiz_app.exe
          windeployqt --release --no-translations --no-system-d3d-compiler dist\quiz_app.exe

# 4. Pak til 100% Silent Portable Standalone EXE med Auto-Cleanup (Native Windows .NET)
      - name: Package Single-File Standalone EXE
        run: |
          
          & "C:\Program Files\7-Zip\7z.exe" a -r -mx9 app.zip .\dist\*

         
          $launcherCode = @"
          using System;
          using System.IO;
          using System.IO.Compression;
          using System.Diagnostics;
          using System.Reflection;

          class Program {
              [STAThread]
              static void Main() {
                  string tempFolder = Path.Combine(Path.GetTempPath(), "EasaB2Quiz_" + Guid.NewGuid().ToString("N"));
                  try {
                      Directory.CreateDirectory(tempFolder);
                      
                      
                      using (Stream stream = Assembly.GetExecutingAssembly().GetManifestResourceStream("app.zip"))
                      using (ZipArchive archive = new ZipArchive(stream)) {
                          archive.ExtractToDirectory(tempFolder);
                      }

                      
                      string exePath = Path.Combine(tempFolder, "quiz_app.exe");
                      ProcessStartInfo psi = new ProcessStartInfo(exePath) {
                          WorkingDirectory = tempFolder,
                          UseShellExecute = false
                      };

                      using (Process proc = Process.Start(psi)) {
                          proc.WaitForExit();
                      }
                  }
                  catch (Exception) { }
                  finally {
                      
                      try {
                          if (Directory.Exists(tempFolder)) {
                              Directory.Delete(tempFolder, true);
                          }
                      }
                      catch (Exception) { }
                  }
              }
          }
          "@
          [System.IO.File]::WriteAllText("Launcher.cs", $launcherCode, [System.Text.Encoding]::UTF8)

          
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /target:winexe /optimize+ /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /resource:app.zip /out:Easa-B2-Quiz.exe Launcher.cs

      - name: Self-Sign Executable
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=EASA B2 Quiz" -CertStoreLocation "Cert:\CurrentUser\My"
          $certPath = "Cert:\CurrentUser\My\" + $cert.Thumbprint
          Set-AuthenticodeSignature -FilePath ".\Easa-B2-Quiz.exe" -Certificate (Get-Item $certPath) -TimestampServer "http://timestamp.digicert.com"

      # 6. Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easa-B2-Quiz-Windows
          path: Easa-B2-Quiz.exe
          if-no-files-found: error

     # 7. Opret GitHub Release med unikt build-tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Easa-B2-Quiz.exe
          tag_name: build-${{ github.run_number }}
          name: "EASA B2 Quiz - Build ${{ github.run_number }}"
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
