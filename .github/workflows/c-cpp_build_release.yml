name: Build & Publish Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install & Cache Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          dir: ${{ runner.temp }}
          cache: 'true'
          cache-key-prefix: '${{ runner.os }}-Qt-6.6.2-mingw64'

      # 2. Configure & Build Project med CMake og Ninja
      - name: Configure CMake
        run: |
          cmake -S code -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release

# 3. Saml Qt DLL'er med windeployqt
      - name: Collect Dependencies (windeployqt)
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\Easa-B2-Quiz.exe dist\quiz_app.exe
          windeployqt --release --no-translations --no-system-d3d-compiler dist\quiz_app.exe

      # 4. Pak til 100% Silent Portable Standalone EXE med Auto-Cleanup
      - name: Package Single-File Standalone EXE
        run: |
          
          Invoke-WebRequest -Uri "https://github.com/mcmilk/7-Zip-zstd/releases/download/v22.01-v1.5.5-R1/7z-Extra.zip" -OutFile "7z-extra.zip" -UseBasicParsing
          & "C:\Program Files\7-Zip\7z.exe" x "7z-extra.zip" -o"sfx_modules" "x64/7zSD.sfx" -r

          
          & "C:\Program Files\7-Zip\7z.exe" a -r -mx9 app.7z .\dist\*

          
          $config = @"
          ;!@Install@!UTF-8!
          GUIMode="2"
          RunProgram="quiz_app.exe"
          ;!@InstallEnd@!
          "@
          [System.IO.File]::WriteAllText("config.txt", $config, [System.Text.Encoding]::UTF8)

          
          $sfxPath = Resolve-Path "sfx_modules\x64\7zSD.sfx"
          cmd /c "copy /b `"$sfxPath`" + config.txt + app.7z Easa-B2-Quiz.exe"


      - name: Self-Sign Executable
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=EASA B2 Quiz" -CertStoreLocation "Cert:\CurrentUser\My"
          $certPath = "Cert:\CurrentUser\My\" + $cert.Thumbprint
          Set-AuthenticodeSignature -FilePath ".\Easa-B2-Quiz.exe" -Certificate (Get-Item $certPath) -TimestampServer "http://timestamp.digicert.com"

      # 6. Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easa-B2-Quiz-Windows
          path: Easa-B2-Quiz.exe
          if-no-files-found: error

     # 7. Opret GitHub Release med unikt build-tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Easa-B2-Quiz.exe
          tag_name: build-${{ github.run_number }}
          name: "EASA B2 Quiz - Build ${{ github.run_number }}"
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
