name: Build & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Installer Qt 6.8.2 og MinGW 13.1.0
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310'
          dir: ${{ runner.temp }}
          cache: 'true'
          cache-key-prefix: '${{ runner.os }}-Qt-6.8.2-mingw1310'

      # 2. Opsæt PATH og find MinGW 13.1.0 compiler
      - name: Setup Compiler and Paths
        id: setup-tools
        run: |
          $toolsPath = "${{ runner.temp }}\Qt\Tools"
          $gxx = (Get-ChildItem -Path $toolsPath -Filter "g++.exe" -Recurse | Select-Object -First 1).FullName
          $gcc = (Get-ChildItem -Path $toolsPath -Filter "gcc.exe" -Recurse | Select-Object -First 1).FullName
          $mingwBin = (Get-Item $gxx).DirectoryName
          $qtBin = "${{ env.Qt6_DIR }}\bin"

          echo "CXX_COMPILER=$gxx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C_COMPILER=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "MINGW_BIN=$mingwBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          echo "$mingwBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$qtBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 3. Konfigurer og byg projektet
      - name: Configure and Build
        run: |
          cmake -S code -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="${{ env.C_COMPILER }}" `
            -DCMAKE_CXX_COMPILER="${{ env.CXX_COMPILER }}"
          cmake --build build --config Release

      # 4. Saml alle de nødvendige filer i dist-mappen
      - name: Collect Dependencies
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\Easa-B2-Quiz.exe dist\quiz_app.exe

          $qtBin = "${{ env.Qt6_DIR }}\bin"
          $mingwBin = "${{ env.MINGW_BIN }}"

          # Kør windeployqt med fuld plugin-deployment
          & "$qtBin\windeployqt.exe" --release --compiler-runtime dist\quiz_app.exe

          # Kopier MinGW DLL'er og OpenGL software rasterizer
          Copy-Item "$mingwBin\libstdc++-6.dll" dist\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$mingwBin\libgcc_s_seh-1.dll" dist\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$mingwBin\libwinpthread-1.dll" dist\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$qtBin\opengl32sw.dll" dist\ -Force -ErrorAction SilentlyContinue

      # 5. Pak alt sammen til en Standalone Single-File Easa-B2-Quiz.exe
      - name: Package Single-File Standalone EXE
        run: |
          # 1. Pak hele dist-mappen ned i et indlejret zip-arkiv
          & "C:\Program Files\7-Zip\7z.exe" a -r -mx9 app.zip .\dist\*

          # 2. Skriv C# launcher (udpakker til AppData, starter quiz_app.exe og rydder op)
          $launcherCode = @"
          using System;
          using System.IO;
          using System.IO.Compression;
          using System.Diagnostics;
          using System.Reflection;

          class Program {
              [STAThread]
              static void Main() {
                  string appData = Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData);
                  string targetFolder = Path.Combine(appData, "EasaB2Quiz_App");

                  try {
                      if (Directory.Exists(targetFolder)) {
                          try { Directory.Delete(targetFolder, true); } catch { }
                      }
                      Directory.CreateDirectory(targetFolder);

                      using (Stream stream = Assembly.GetExecutingAssembly().GetManifestResourceStream("app.zip"))
                      using (ZipArchive archive = new ZipArchive(stream)) {
                          archive.ExtractToDirectory(targetFolder);
                      }

                      string exePath = Path.Combine(targetFolder, "quiz_app.exe");
                      ProcessStartInfo psi = new ProcessStartInfo(exePath) {
                          WorkingDirectory = targetFolder,
                          UseShellExecute = true
                      };

                      using (Process proc = Process.Start(psi)) {
                          if (proc != null) {
                              proc.WaitForExit();
                          }
                      }
                  }
                  catch (Exception) { }
                  finally {
                      try {
                          if (Directory.Exists(targetFolder)) {
                              Directory.Delete(targetFolder, true);
                          }
                      }
                      catch (Exception) { }
                  }
              }
          }
          "@
          [System.IO.File]::WriteAllText("Launcher.cs", $launcherCode, [System.Text.Encoding]::UTF8)

          # 3. Kompiler til Easa-B2-Quiz.exe uden sort konsolvindue
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /target:winexe /optimize+ /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /resource:app.zip /out:Easa-B2-Quiz.exe Launcher.cs

      # 6. Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easa-B2-Quiz-Windows
          path: Easa-B2-Quiz.exe
          if-no-files-found: error

      # 7. Opret GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Easa-B2-Quiz.exe
          tag_name: build-${{ github.run_number }}
          name: "EASA B2 Quiz - Build ${{ github.run_number }}"
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}