name: Build & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Installer Qt 6.6.2 inkl. medfølgende værktøjer
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          dir: ${{ runner.temp }}
          cache: 'true'
          cache-key-prefix: '${{ runner.os }}-Qt-6.6.2-mingw64'

      # 2. Sæt PATH til Qt's egen MinGW compiler og værktøjer
      - name: Setup Qt MinGW Environment
        run: |
          # Find den MinGW der hører til Qt installationen
          $qtBin = "${{ env.Qt6_DIR }}\bin"
          $mingwBin = "${{ runner.temp }}\Qt\Tools\mingw1120_64\bin"
          
          if (Test-Path $mingwBin) {
            echo "$mingwBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          echo "$qtBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 3. Konfigurer og byg med CMake
      - name: Configure and Build
        run: |
          cmake -S code -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      # 4. Klargør mappe og kopier DLL'er
      - name: Collect Dependencies
        run: |
          New-Item -ItemType Directory -Force -Path Easa-B2-Quiz
          Copy-Item build\Easa-B2-Quiz.exe Easa-B2-Quiz\Easa-B2-Quiz.exe
          
          # Kør windeployqt
          windeployqt --release --no-translations --compiler-runtime Easa-B2-Quiz\Easa-B2-Quiz.exe
          
          # Hent de nødvendige MinGW DLL'er direkte fra Qt's bin
          $qtBin = "${{ env.Qt6_DIR }}\bin"
          Copy-Item "$qtBin\libstdc++-6.dll" Easa-B2-Quiz\ -ErrorAction SilentlyContinue
          Copy-Item "$qtBin\libgcc_s_seh-1.dll" Easa-B2-Quiz\ -ErrorAction SilentlyContinue
          Copy-Item "$qtBin\libwinpthread-1.dll" Easa-B2-Quiz\ -ErrorAction SilentlyContinue

      # 5. Pak til ZIP
      - name: Create Portable Zip
        run: |
          Compress-Archive -Path Easa-B2-Quiz -DestinationPath Easa-B2-Quiz-Windows.zip -Force

      # 6. Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easa-B2-Quiz-Windows
          path: Easa-B2-Quiz-Windows.zip
          if-no-files-found: error

      # 7. Opret GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Easa-B2-Quiz-Windows.zip
          tag_name: build-${{ github.run_number }}
          name: "EASA B2 Quiz - Build ${{ github.run_number }}"
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}