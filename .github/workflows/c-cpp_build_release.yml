name: Build & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Installer Qt 6.8.2 og MinGW 13.1.0
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310'
          dir: ${{ runner.temp }}
          cache: 'true'
          cache-key-prefix: '${{ runner.os }}-Qt-6.8.2-mingw1310'

      # 2. Opsæt PATH og find MinGW compiler
      - name: Setup Compiler and Paths
        id: setup-tools
        run: |
          $toolsPath = "${{ runner.temp }}\Qt\Tools"
          $gxx = (Get-ChildItem -Path $toolsPath -Filter "g++.exe" -Recurse | Select-Object -First 1).FullName
          $gcc = (Get-ChildItem -Path $toolsPath -Filter "gcc.exe" -Recurse | Select-Object -First 1).FullName
          $mingwBin = (Get-Item $gxx).DirectoryName
          $qtBin = "${{ env.Qt6_DIR }}\bin"

          echo "CXX_COMPILER=$gxx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C_COMPILER=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "MINGW_BIN=$mingwBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          echo "$mingwBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$qtBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 3. Konfigurer og byg projektet
      - name: Configure and Build
        run: |
          cmake -S code -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="${{ env.C_COMPILER }}" `
            -DCMAKE_CXX_COMPILER="${{ env.CXX_COMPILER }}"
          cmake --build build --config Release

      # 4. Saml alle Qt & MinGW DLL'er i dist-mappen
      - name: Collect Dependencies
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\Easa-B2-Quiz.exe dist\core_app.exe

          $qtBin = "${{ env.Qt6_DIR }}\bin"
          $mingwBin = "${{ env.MINGW_BIN }}"

          # Kør windeployqt
          & "$qtBin\windeployqt.exe" --release --compiler-runtime dist\core_app.exe

          # Kopier runtime DLL'er og OpenGL software rasterizer
          Copy-Item "$mingwBin\libstdc++-6.dll" dist\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$mingwBin\libgcc_s_seh-1.dll" dist\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$mingwBin\libwinpthread-1.dll" dist\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$qtBin\opengl32sw.dll" dist\ -Force -ErrorAction SilentlyContinue

      # 5. Pak alt ind i en Single-File EXE med Enigma Virtual Box (In-Memory Virtualization)
      - name: Pack Single-File Executable with Enigma Virtual Box
        run: |
          # 1. Installer Enigma Virtual Box
          choco install enigma-virtual-box -y --no-progress

          $distPath = (Resolve-Path "dist").Path
          $coreExe = "$distPath\core_app.exe"
          $outputExe = (Join-Path (Get-Location).Path "Easa-B2-Quiz.exe")

          # 2. Generer Enigma Virtual Box projektfil (evb)
          # Dette fortæller Enigma at indlejre hele dist-mappens indhold virtuelt under %DEFAULT FOLDER%
          $evbXml = @"
          <?xml version="1.0" encoding="utf-8"?>
          <EnigmaVirtualBox Version="1.0">
            <InputFile>$coreExe</InputFile>
            <OutputFile>$outputExe</OutputFile>
            <Files>
              <File Type="2">
                <Path>%DEFAULT FOLDER%</Path>
                <Files>
          "@

          # Tilføj alle filer og mapper fra dist/ til den virtuelle pakke
          Get-ChildItem -Path "dist" -Exclude "core_app.exe" | ForEach-Object {
            if ($_.PSIsContainer) {
              $dirName = $_.Name
              $evbXml += "<File Type=`"2`"><Path>$dirName</Path><Files>"
              Get-ChildItem -Path $_.FullName -Recurse | Where-Object { -not $_.PSIsContainer } | ForEach-Object {
                $subRel = $_.FullName.Substring($_.FullName.IndexOf($dirName) + $dirName.Length + 1)
                $evbXml += "<File Type=`"3`"><Name>$($_.Name)</Name><File>$($_.FullName)</File></File>"
              }
              $evbXml += "</Files></File>"
            } else {
              $evbXml += "<File Type=`"3`"><Name>$($_.Name)</Name><File>$($_.FullName)</File></File>"
            }
          }

          $evbXml += @"
                </Files>
              </File>
            </Files>
            <Options>
              <ShareVirtualSystem>false</ShareVirtualSystem>
              <MapExecutableWithTemporaryFile>false</MapExecutableWithTemporaryFile>
              <AllowRunningOfVirtualExeFiles>true</AllowRunningOfVirtualExeFiles>
            </Options>
          </EnigmaVirtualBox>
          "@

          [System.IO.File]::WriteAllText("package.evb", $evbXml, [System.Text.Encoding]::UTF8)

          # 3. Kør Enigma Console Packer
          & "C:\Program Files (x86)\Enigma Virtual Box\enigmavbconsole.exe" package.evb

      # 6. Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easa-B2-Quiz
          path: Easa-B2-Quiz.exe
          if-no-files-found: error

      # 7. Opret GitHub Release med den færdige Easa-B2-Quiz.exe
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Easa-B2-Quiz.exe
          tag_name: build-${{ github.run_number }}
          name: "EASA B2 Quiz - Build ${{ github.run_number }}"
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}