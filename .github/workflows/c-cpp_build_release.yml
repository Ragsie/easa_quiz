name: Build & Publish Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja & Tools
        run: |
          choco install ninja --no-progress

      - name: Install Qt & MinGW
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      - name: Configure CMake
        run: |
          cmake -S code -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Collect Dependencies (windeployqt)
        run: |
          mkdir dist
          copy build\b2_quiz.exe dist\
          windeployqt --release --no-translations --no-system-d3d-compiler dist\b2_quiz.exe

      - name: Package Single-File EXE (Enigma Virtual Box)
        run: |
          choco install enigma-virtual-box --no-progress
          & "C:\Program Files (x86)\Enigma Virtual Box\enigmavbgen.exe" dist\b2_quiz.exe dist\b2_quiz_standalone.exe dist\
          & "C:\Program Files (x86)\Enigma Virtual Box\enigmavbconsole.exe" generated_project.evb

      # Gemmer filen som et Artifact (så den kan downloades ved enhver almindelig push)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EASA_B2_Quiz_Executable
          path: dist/b2_quiz_standalone.exe

      # Opretter officiel GitHub Release (hvis der er pushet et versions-tag som v1.0)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/b2_quiz_standalone.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
