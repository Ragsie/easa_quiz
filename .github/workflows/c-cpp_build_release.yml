name: Build & Publish Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          cache: 'true'
          cache-key-prefix: '${{ runner.os }}-Qt-6.6.2-mingw64'

      # 2. Configure & Build Project med CMake og Ninja
      - name: Configure CMake
        run: |
          cmake -S code -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release
     
     # 3. Klargør dist-mappe og saml Qt DLL'er
      - name: Collect Dependencies (windeployqt)
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\Easa-B2-Quiz.exe dist\app_base.exe
          windeployqt --release --no-translations --no-system-d3d-compiler dist\app_base.exe

      # 4. Pak alt sammen med Enigma Virtualbox Action
      - name: Package Single-File Standalone EXE
        uses: qiazo/enigma-virtualbox-action@v1
        with:
          entry: dist
          input: dist/app_base.exe
          output: dist/Easa-B2-Quiz.exe

      # 5. Flyt og verificer at filen eksisterer
      - name: Verify Executable Exists
        run: |
          if (Test-Path "dist\Easa-B2-Quiz.exe") {
            Move-Item "dist\Easa-B2-Quiz.exe" ".\Easa-B2-Quiz.exe"
            Get-Item ".\Easa-B2-Quiz.exe"
          } else {
            Write-Error "Easa-B2-Quiz.exe was not created!"
          }

      # 6. Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easa-B2-Quiz-Windows
          path: Easa-B2-Quiz.exe
          if-no-files-found: error

      # 7. Opret GitHub Release (ved git tags)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Easa-B2-Quiz.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
